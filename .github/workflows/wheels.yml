name: wheels

# Builds the gshtools wheels (precompiled binaries only, no source distribution) and publishes them to PyPI.
# Two caches keep a release from rebuilding everything: the vcpkg binary cache (Eigen) and sccache (compiled objects of
# the library, identical for every Python version).
# Publishing uses PyPI Trusted Publishing (no token): project gshtools, workflow wheels.yml, environment pypi.
# It only runs for a version tag (v*); a manual run (workflow_dispatch) builds and tests but never publishes.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels-windows:
    name: wheels (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache vcpkg packages
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Set up sccache (compiler cache)
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Load the MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build and test the wheels
        uses: pypa/cibuildwheel@v3.4.1
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache
          SCCACHE_GHA_ENABLED: "true"
          SCCACHE_IGNORE_SERVER_IO_ERROR: "1"   # a cache outage must not fail the build
          CIBW_BUILD: "cp310-win_amd64 cp311-win_amd64 cp312-win_amd64 cp313-win_amd64"
          CIBW_ENVIRONMENT: >-
            CMAKE_GENERATOR=Ninja
            CMAKE_ARGS="-DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows"
          CIBW_TEST_REQUIRES: pytest numpy
          CIBW_TEST_COMMAND: python -m pytest {project}/tests/py -q

      - name: Show cache statistics
        if: always()
        shell: pwsh
        run: sccache --show-stats

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-windows
          path: wheelhouse/*.whl

  wheels-linux:
    name: wheels (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # cibuildwheel builds inside a manylinux container; ccache keeps its cache in a mounted directory.
      - name: Cache compiled objects (ccache)
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-linux-${{ hashFiles('src/cpp/**', 'src/python/**', 'CMakeLists.txt') }}
          restore-keys: ccache-linux-

      - name: Build and test the wheels
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_BUILD: "cp310-manylinux_x86_64 cp311-manylinux_x86_64 cp312-manylinux_x86_64 cp313-manylinux_x86_64"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          # Eigen (header-only) and ccache are installed by the script; libgomp is vendored by auditwheel.
          CIBW_BEFORE_ALL_LINUX: sh {project}/.github/scripts/linux_before_all.sh
          CIBW_ENVIRONMENT_LINUX: >-
            CMAKE_GENERATOR=Ninja
            CMAKE_PREFIX_PATH=/usr/local
            CMAKE_ARGS="-DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
            CCACHE_DIR=/project/.ccache
          CIBW_TEST_REQUIRES: pytest numpy
          CIBW_TEST_COMMAND: python -m pytest {project}/tests/py -q

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux
          path: wheelhouse/*.whl

  publish:
    name: publish to PyPI
    needs: [wheels-windows, wheels-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
